name: CI

"on":
  workflow_dispatch:
  # Auto-run disabled: tests are run locally before pushing. Trigger manually
  # via the Actions tab or `gh workflow run ci.yml` for a clean-room check.
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
