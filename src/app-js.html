<script>
  /* ════════════════════════════════════════════════════════════════════════
     Shared constants — keep names in sync with utils.ts ExportFormat so the
     server-side filename builder and the client-side download fallback both
     speak the same `.g2j.json` / `export` vocabulary.
     ════════════════════════════════════════════════════════════════════════ */
  var EXPORT_EXTENSION = '.g2j.json';
  var DEFAULT_EXPORT_NAME = 'export';

  /* ════════════════════════════════════════════════════════════════════════
     Status strip — one shared mini progress bar driven by a fake fill.
     Apps Script has no real streaming progress, so we ramp to 92% over
     `slow` mode (8s) or `fast` mode (0.6s) and snap to 100% on success.
     ════════════════════════════════════════════════════════════════════════ */
  var statusStrip    = document.getElementById('statusStrip');
  var statusFill     = document.getElementById('statusFill');
  var statusMessage  = document.getElementById('statusMessage');
  var statusPercent  = document.getElementById('statusPercent');

  var progressTimer = null;
  var progressGen = 0;
  var statusHideTimer = null;
  var statusVisibleAt = 0;
  var STATUS_MIN_VISIBLE_MS = 5000;
  function setProgress(pct) {
    pct = Math.max(0, Math.min(100, pct));
    statusFill.style.width = `${pct}%`;
    statusPercent.textContent = `${Math.round(pct)}%`;
  }
  function clearStatusHideTimer() {
    if (statusHideTimer) { clearTimeout(statusHideTimer); statusHideTimer = null; }
  }
  function markStatusVisible() {
    clearStatusHideTimer();
    statusVisibleAt = Date.now();
    statusStrip.classList.add('visible');
  }
  function scheduleStatusHide() {
    clearStatusHideTimer();
    const elapsed = Date.now() - statusVisibleAt;
    const wait = Math.max(0, STATUS_MIN_VISIBLE_MS - elapsed);
    statusHideTimer = setTimeout(function() {
      statusStrip.classList.remove('visible');
      setProgress(0);
      if (typeof autosizeStaging === 'function') autosizeStaging();
    }, wait);
  }
  function stopProgressTimer() {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    progressGen++;
  }
  /**
   * Start the status strip with a fake easeOutCubic fill. Used for local-only
   * ops (reading a file in the browser, blob download) that don't have a
   * corresponding server-side progress stream.
   */
  function startStatus(message, kind) {
    statusMessage.textContent = message || 'Working\u2026';
    setProgress(0);
    markStatusVisible();
    if (typeof autosizeStaging === 'function') autosizeStaging();
    stopProgressTimer();
    const duration = kind === 'fast' ? 600 : 8000;
    const start = Date.now();
    progressTimer = setInterval(function() {
      const elapsed = Date.now() - start;
      const t = Math.min(1, elapsed / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setProgress(eased * 92);
      if (t >= 1) stopProgressTimer();
    }, 50);
  }
  /**
   * Start the status strip in polling mode: every 400ms, read the live
   * `{ pct, msg }` checkpoint from the server's CacheService channel for
   * this op's `sessionId`. The caller still drives finishStatus / abortStatus.
   */
  function startStatusPolled(sessionId, initialMessage) {
    statusMessage.textContent = initialMessage || 'Working\u2026';
    setProgress(0);
    markStatusVisible();
    if (typeof autosizeStaging === 'function') autosizeStaging();
    stopProgressTimer();
    if (!sessionId) return;
    const myGen = progressGen;
    progressTimer = setInterval(function() {
      google.script.run
        .withSuccessHandler(function(p) {
          if (myGen !== progressGen) return;
          if (!p) return;
          if (typeof p.pct === 'number') setProgress(p.pct);
          if (p.msg) statusMessage.textContent = p.msg;
        })
        .withFailureHandler(function() {})
        .gsheet2json_handleCommand('getProgress', { sessionId: sessionId });
    }, 400);
  }
  function finishStatus() {
    stopProgressTimer();
    setProgress(100);
    scheduleStatusHide();
  }
  function abortStatus() {
    stopProgressTimer();
    setProgress(0);
    scheduleStatusHide();
  }
  /** Generate a short random session id for progress polling. */
  function newSessionId() {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  /* ════════════════════════════════════════════════════════════════════════
     Activity feed
     ════════════════════════════════════════════════════════════════════════ */
  var activityList     = document.getElementById('activityList');
  var activityClearBtn = document.getElementById('activityClearBtn');
  var copyToast   = document.getElementById('copyToast');
  var toastTimer  = null;

  function showToast(message, x, y) {
    if (!copyToast) return;
    copyToast.textContent = message || 'Copied to clipboard';
    copyToast.classList.add('visible');
    if (typeof x === 'number' && typeof y === 'number') {
      // Default: horizontally centered on cursor x, 20px below cursor y.
      copyToast.style.left = `${x}px`;
      copyToast.style.top  = `${y + 20}px`;
      copyToast.style.transform = 'translate(-50%, 0)';
      // Measure on next frame and snap any clipping back into the viewport:
      // if the right edge clips, anchor the toast's right edge to the cursor;
      // if the left edge clips, anchor its left edge to the cursor; if the
      // bottom clips, flip above the cursor.
      requestAnimationFrame(function() {
        const r = copyToast.getBoundingClientRect();
        const margin = 4;
        let tx = -50, ty = 0;
        let topPx = y + 20;
        if (r.right > window.innerWidth - margin) tx = -100;
        else if (r.left < margin) tx = 0;
        if (r.bottom > window.innerHeight - margin) {
          ty = -100;
          topPx = y - 4;
        }
        copyToast.style.transform = `translate(${tx}%, ${ty}%)`;
        copyToast.style.top = `${topPx}px`;
      });
    } else {
      // Center in viewport (CSS defaults take over).
      copyToast.style.left = '';
      copyToast.style.top  = '';
      copyToast.style.transform = '';
    }
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      copyToast.classList.remove('visible');
      toastTimer = null;
    }, 1400);
  }

  function renderActivity(entries) {
    entries = entries || [];
    activityList.innerHTML = '';
    if (entries.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'activity-empty';
      empty.innerHTML = 'No activity yet.<br>Upload, download,<br>load or save a JSON<br>to get started.';
      activityList.appendChild(empty);
      activityClearBtn.hidden = true;
      return;
    }
    activityClearBtn.hidden = false;
    entries.forEach(function(e) { activityList.appendChild(renderActivityRow(e)); });
  }
  function renderActivityRow(e) {
    const row = document.createElement('div');
    row.className = `activity-row ${e.ok ? 'ok' : 'error'}`;

    const body = document.createElement('div');
    body.className = 'activity-body';

    const title = document.createElement('div');
    title.className = 'activity-title-text';
    title.textContent = e.title || '';
    if (!e.ok && e.error) {
      title.style.cursor = 'pointer';
      title.title = 'Error: ' + e.error + '\n(click to copy)';
      title.onclick = function(ev) { showErrorDetails(e, ev); };
    }
    body.appendChild(title);

    const actions = document.createElement('div');
    actions.className = 'activity-actions';

    if (e.fileId) {
      actions.appendChild(makeActivityIconButton(
        'Open file',
        '<path d="M14 1H6c-1.1 0-2 .9-2 2v17c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-7zm1 7V2.5L19.5 9H15z"/>',
        function() { openDriveFile(e); }
      ));
      actions.appendChild(makeActivityIconButton(
        'Show enclosing folder',
        '<path d="M10 4H3.5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16.5c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>',
        function() { showFileInDrive(e); }
      ));
      const dlBtn = makeActivityIconButton(
        'Download',
        '<path d="M21 9h-5V2H8v7H3l9 9 9-9zM3 20v3h18v-3H3z"/>',
        function() { downloadFromDrive(e, dlBtn); }
      );
      actions.appendChild(dlBtn);
    }
    /* Error details now accessible by clicking the title row directly. */
    if (actions.childNodes.length > 0) body.appendChild(actions);
    row.appendChild(body);

    const time = document.createElement('div');
    time.className = 'activity-time';
    time.textContent = formatTime(e.at);
    time.title = formatFullDateTime(e.at);
    row.appendChild(time);

    return row;
  }
  function formatTime(iso) {
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      // Locale-aware short time (12-hour with AM/PM in en-US, 24-hour where local).
      return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    } catch (_) { return ''; }
  }
  function formatFullDateTime(iso) {
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      const pad = function(n) { return n < 10 ? `0${n}` : `${n}`; };
      const date = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
      return `${date} ${time}`;
    } catch (_) { return ''; }
  }

  function activityEntry(entry) {
    google.script.run
      .withSuccessHandler(renderActivity)
      .withFailureHandler(function() {})
      .gsheet2json_handleCommand('appendActivityEntry', entry);
  }
  function loadActivity() {
    google.script.run
      .withSuccessHandler(renderActivity)
      .withFailureHandler(function() {})
      .gsheet2json_handleCommand('getActivityFeed');
  }
  activityClearBtn.onclick = function() {
    google.script.run
      .withSuccessHandler(renderActivity)
      .withFailureHandler(function() {})
      .gsheet2json_handleCommand('clearActivityFeed');
  };

  /** Open the parent folder of a Drive file in a new tab (activity action). */
  function makeActivityIconButton(title, path, onClick) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'activity-action-icon';
    btn.title = title;
    btn.setAttribute('aria-label', title);
    btn.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;
    btn.onclick = onClick;
    return btn;
  }
  function openDriveFile(e) {
    if (!e || !e.fileId) return;
    const fileUrl = e.openUrl || `https://drive.google.com/file/d/${e.fileId}/view`;
    window.open(fileUrl, '_blank', 'noopener,noreferrer');
  }
  /** Open the parent folder of a Drive file in a new tab (activity action). */
  function showFileInDrive(e) {
    if (!e.fileId) return;
    google.script.run
      .withSuccessHandler(function(url) {
        if (url) window.open(url, '_blank', 'noopener,noreferrer');
        else if (e.openUrl) window.open(e.openUrl, '_blank', 'noopener,noreferrer');
      })
      .withFailureHandler(function() {
        if (e.openUrl) window.open(e.openUrl, '_blank', 'noopener,noreferrer');
      })
      .gsheet2json_handleCommand('getFileFolderUrl', { fileId: e.fileId });
  }

  /** Re-fetch a Drive file and trigger a local blob download (activity action). */
  function downloadFromDrive(e, btn) {
    if (!e.fileId) return;
    const originalTitle = btn ? btn.title : null;
    if (btn) { btn.disabled = true; btn.title = 'Fetching\u2026'; }
    google.script.run
      .withSuccessHandler(function(info) {
        if (btn) { btn.disabled = false; btn.title = originalTitle; }
        if (info && info.content != null) {
          triggerBlobDownload(info.filename || (DEFAULT_EXPORT_NAME + EXPORT_EXTENSION), info.content);
        }
      })
      .withFailureHandler(function(err) {
        if (btn) { btn.disabled = false; btn.title = originalTitle; }
        const msg = (err && err.message) ? err.message : 'Download failed';
        alert(msg);
      })
      .gsheet2json_handleCommand('getDriveFileInfo', e.fileId);
  }

  function showErrorDetails(e, ev) {
    const msg = (e.error || e.subtitle || e.title || 'Unknown error');
    const x = ev && typeof ev.clientX === 'number' ? ev.clientX : undefined;
    const y = ev && typeof ev.clientY === 'number' ? ev.clientY : undefined;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg).then(function() {
        showToast('Error details copied', x, y);
      }).catch(function() {
        showToast('Could not copy', x, y);
      });
    } else {
      showToast('Clipboard unavailable', x, y);
    }
  }

  /* ════════════════════════════════════════════════════════════════════════
     Tile actions
     ════════════════════════════════════════════════════════════════════════ */
  var tileImportLocal  = document.getElementById('tileImportLocal');
  var tileImportDrive  = document.getElementById('tileImportDrive');
  var tileExportLocal  = document.getElementById('tileExportLocal');
  var tileExportDrive  = document.getElementById('tileExportDrive');
  var fileInput        = document.getElementById('fileInput');

  var tilesLockedByLicense = false;

  function setTilesBusy(busy) {
    var disabled = !!busy || tilesLockedByLicense;
    [tileImportLocal, tileImportDrive, tileExportLocal, tileExportDrive].forEach(function(t) {
      if (t) t.disabled = disabled;
    });
  }

  function setTilesLockedByLicense(locked) {
    tilesLockedByLicense = !!locked;
    var title = locked ? 'Trial expired — upgrade to use' : '';
    [tileImportLocal, tileImportDrive, tileExportLocal, tileExportDrive].forEach(function(t) {
      if (t) {
        t.disabled = tilesLockedByLicense;
        t.title = title;
      }
    });
  }

  // ── Upload (load a local .json file into the staging textarea) ──
  tileImportLocal.onclick = function() { fileInput.click(); };
  fileInput.onchange = function() {
    const f = this.files && this.files[0];
    this.value = '';
    if (!f) return;
    startStatus(`Reading ${f.name}\u2026`, 'fast');
    setTilesBusy(true);
    const r = new FileReader();
    r.onload = function() {
      setTilesBusy(false);
      finishStatus();
      stagingSource = f.name;
      stagingTextarea.value = r.result || '';
      validateStaging();
      growStagingToFitContent();
      stagingTextarea.focus();
    };
    r.onerror = function() {
      setTilesBusy(false);
      abortStatus();
      activityEntry({ ok: false, title: `Could not read ${f.name}` });
    };
    r.readAsText(f);
  };

  // ── Download (export to local file) ──
  tileExportLocal.onclick = function() {
    const sid = newSessionId();
    startStatusPolled(sid, 'Generating JSON\u2026');
    setTilesBusy(true);
    google.script.run
      .withSuccessHandler(function(data) {
        setTilesBusy(false);
        finishStatus();
        triggerBlobDownload(data.filename, data.content);
        activityEntry({ ok: true, title: `Downloaded "${data.filename}"` });
      })
      .withFailureHandler(function(err) {
        setTilesBusy(false);
        abortStatus();
        const msg = (err && err.message) ? err.message : 'Download failed';
        activityEntry({ ok: false, title: 'Download failed', error: msg });
      })
      .gsheet2json_handleCommand('getExportJsonString', { sessionId: sid });
  };
  function triggerBlobDownload(filename, content) {
    const blob = new Blob([content], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || (DEFAULT_EXPORT_NAME + EXPORT_EXTENSION);
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  }

  // ── To Drive (export to Drive) ──
  tileExportDrive.onclick = function() {
    const sid = newSessionId();
    startStatusPolled(sid, 'Saving to Google Drive\u2026');
    setTilesBusy(true);
    google.script.run
      .withSuccessHandler(function(info) {
        setTilesBusy(false);
        finishStatus();
        activityEntry({
          ok: true,
          title: `Saved "${info.filename}" to Drive`,
          fileId: info.fileId,
          openUrl: info.url
        });
      })
      .withFailureHandler(function(err) {
        setTilesBusy(false);
        abortStatus();
        const msg = (err && err.message) ? err.message : 'Save failed';
        activityEntry({ ok: false, title: 'Save to Drive failed', error: msg });
      })
      .gsheet2json_handleCommand('runExportAndSave', { sessionId: sid });
  };

  /* ════════════════════════════════════════════════════════════════════════
     Staging area — validate JSON and commit to the sheet.
     Upload and From Drive populate this textarea; the user reviews and
     clicks Import to actually write the sheet. Paste/edit works too.
     ════════════════════════════════════════════════════════════════════════ */
  var stagingTextarea = document.getElementById('stagingTextarea');
  var stagingGutter   = document.getElementById('stagingGutter');
  var stagingStatus   = document.getElementById('stagingStatus');
  var stagingClear    = document.getElementById('stagingClear');
  var stagingImport   = document.getElementById('stagingImport');
  var stagingEditor   = document.getElementById('stagingEditor');
  var stagingErrorMarker = document.getElementById('stagingErrorMarker');
  var stagingPlaceholder = document.getElementById('stagingPlaceholder');
  function updateStagingPlaceholder() {
    if (!stagingPlaceholder) return;
    if (stagingTextarea.value.length > 0) stagingPlaceholder.classList.add('hidden');
    else stagingPlaceholder.classList.remove('hidden');
  }
  var stagingPanel    = document.querySelector('.staging');
  var activityPanel        = document.querySelector('.activity');
  var sidebarEl       = document.getElementById('sidebar');
  var stagingSource   = '';  // human-readable source label for the activity entry
  var stagingParseError = null;
  var stagingValidateTimer = null;
  var STAGING_VALIDATE_IDLE_MS = 3000;
  var RESIZE_HANDLE_ZONE = 10;
  var isStagingResizeDrag = false;

  /* ── Staging layout and divider sizing ──────────────────────────────── */
  var STAGING_MIN_H = 110;
  var STAGING_DEFAULT_H = 220;
  var LOG_MIN_H = 96;
  var stagingPreferredH = STAGING_DEFAULT_H;

  function measureFixedChromeH() {
    // Sum of everything in the sidebar that isn't the staging panel and activity feed.
    const sidebar = document.getElementById('sidebar');
    const footer = document.getElementById('footerBar');
    const tileRow = sidebar.querySelector('.tile-row');
    const picker = document.getElementById('drivePicker');
    const accent = 3;
    const statusH = statusStrip ? statusStrip.offsetHeight : 0;
    const tileRowH = tileRow ? tileRow.offsetHeight : 0;
    const pickerH = picker && picker.classList.contains('visible') ? picker.offsetHeight : 0;
    const footerH = footer ? footer.offsetHeight : 0;
    return accent + statusH + tileRowH + pickerH + footerH;
  }
  function computeStagingBounds() {
    const sidebarH = sidebarEl.clientHeight || window.innerHeight;
    const available = sidebarH - measureFixedChromeH() - LOG_MIN_H;
    const maxH = Math.max(STAGING_MIN_H, available);
    return { min: STAGING_MIN_H, max: maxH };
  }
  function applyStagingHeight(next) {
    const b = computeStagingBounds();
    const h = Math.max(b.min, Math.min(next, b.max));
    stagingPreferredH = h;
    stagingPanel.style.height = `${h}px`;
  }
  function autosizeStaging() {
    applyStagingHeight(stagingPreferredH);
  }
  function growStagingToFitContent() {
    const chromeH = stagingPanel.offsetHeight - stagingTextarea.clientHeight;
    const desired = stagingTextarea.scrollHeight + chromeH;
    if (desired > stagingPreferredH) applyStagingHeight(desired);
  }
  function escapeAttr(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function renderLineNumbers() {
    const lineCount = (stagingTextarea.value.match(/\n/g) || []).length + 1;
    const digits = String(lineCount).length;
    // Just the digits + a hair of breathing room. The warning marker is no
    // longer in this column — it's an absolute overlay sitting on the gutter↔
    // textarea seam, so the gutter never has to widen for it.
    stagingGutter.style.width = `calc(${Math.max(1, digits)}ch + 2px)`;
    const lines = [];
    for (let i = 1; i <= lineCount; i++) {
      const cls = (stagingParseError && stagingParseError.line === i)
        ? 'staging-gutter-line error'
        : 'staging-gutter-line';
      lines.push(`<span class="${cls}">${i}</span>`);
    }
    stagingGutter.innerHTML = lines.join('');
    syncGutterScroll();
    updateErrorMarker();
  }
  function getStagingLineHeight() {
    const cs = window.getComputedStyle(stagingTextarea);
    const fs = parseFloat(cs.fontSize) || 10;
    const raw = cs.lineHeight;
    if (raw === 'normal') return fs * 1.2;
    const v = parseFloat(raw);
    if (isNaN(v)) return fs * 1.2;
    // Unitless multipliers ("1.45") parse as small floats; explicit pixels
    // ("14.5px") parse as the px value. Threshold of 4 cleanly separates them.
    return v < 4 ? v * fs : v;
  }
  function updateErrorMarker() {
    if (!stagingErrorMarker) return;
    if (!stagingParseError || !stagingParseError.line) {
      stagingErrorMarker.hidden = true;
      stagingErrorMarker.textContent = '';
      return;
    }
    const cs = window.getComputedStyle(stagingTextarea);
    const lineHeight = getStagingLineHeight();
    const padTop = parseFloat(cs.paddingTop) || 0;
    const lineCenterY = padTop + (stagingParseError.line - 0.5) * lineHeight - stagingTextarea.scrollTop;
    const viewH = stagingTextarea.clientHeight;
    if (lineCenterY < 0 || lineCenterY > viewH) {
      stagingErrorMarker.hidden = true;
      return;
    }
    stagingErrorMarker.textContent = '\u26a0\ufe0f';
    stagingErrorMarker.title = stagingParseError.message || '';
    stagingErrorMarker.style.top = `${lineCenterY}px`;
    stagingErrorMarker.style.left = `${stagingGutter.offsetWidth}px`;
    stagingErrorMarker.hidden = false;
  }
  function parseErrorLocation(message, text) {
    const out = { line: null, column: null, position: null };
    const mLine = /line\s+(\d+)/i.exec(message || '');
    if (mLine) out.line = parseInt(mLine[1], 10);
    const mCol = /column\s+(\d+)/i.exec(message || '');
    if (mCol) out.column = parseInt(mCol[1], 10);
    const mPos = /position\s+(\d+)/i.exec(message || '');
    if (mPos) {
      const pos = parseInt(mPos[1], 10);
      const s = String(text || '');
      if (!isNaN(pos) && pos >= 0) {
        // V8 reports the position of the *unexpected token*, not the user's
        // mistake. When a delimiter (e.g. comma) is missing at the end of
        // line N, the parser only fails when it reaches the next token,
        // which is typically the first non-whitespace character of line N+1
        // — making a naive line calc blame the wrong line. Walk back
        // through whitespace (including newlines) to land on the last
        // meaningful character before the break; that character is almost
        // always where the user's edit actually went wrong.
        let refined = Math.min(pos, Math.max(0, s.length - 1));
        while (refined > 0 && /\s/.test(s.charAt(refined))) refined--;
        out.position = refined;
        const before = s.slice(0, refined);
        const split = before.split('\n');
        out.line = split.length;
        out.column = split[split.length - 1].length + 1;
      }
    }
    return out;
  }
  function isNearResizeBoundary(clientY) {
    const a = stagingPanel.getBoundingClientRect();
    const b = activityPanel.getBoundingClientRect();
    return Math.abs(clientY - a.bottom) <= RESIZE_HANDLE_ZONE ||
      Math.abs(clientY - b.top) <= RESIZE_HANDLE_ZONE;
  }
  // The picker's bottom border doubles as a resize handle when the picker
  // is open. Mirror the staging↔activity resize wiring.
  var isPickerResizeDrag = false;
  var isHiddenListResizeDrag = false;
  function isNearPickerBoundary(clientY) {
    const pickerEl = document.getElementById('drivePicker');
    if (!pickerEl || !pickerEl.classList.contains('visible')) return false;
    const r = pickerEl.getBoundingClientRect();
    return Math.abs(clientY - r.bottom) <= RESIZE_HANDLE_ZONE;
  }
  // Top edge of the picker-foot (when expanded) is a drag handle that grows
  // the hidden-list upward, taking space from the picker-list above.
  function isNearHiddenListBoundary(clientY) {
    const pickerEl = document.getElementById('drivePicker');

    const folderLabel = f.folderName ? f.folderName : '(My Drive)';
    const sizeLabel = f.sizeBytes ? ` \u00b7 ${formatBytes(f.sizeBytes)}` : '';
    folderEl.textContent = `${folderLabel}${sizeLabel}`;
    nameWrap.appendChild(folderEl);
    row.appendChild(nameWrap);

    const actions = document.createElement('div');
    actions.className = 'pr-actions';
    const menuBtn = document.createElement('button');
    menuBtn.type = 'button';
    menuBtn.className = 'icon-btn small';
    menuBtn.setAttribute('aria-label', 'More');
    menuBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
    menuBtn.onclick = function(e) {
      e.stopPropagation();
      // Toggle: if this row's menu is already open, close it. Otherwise close
      // any other open menus and open this one.
      const alreadyOpen = menu.classList.contains('open');
      closeRowMenus();
      if (!alreadyOpen) menu.classList.add('open');
    };

    const menu = buildHideMenu(f);
    actions.appendChild(menuBtn);
    actions.appendChild(menu);
    row.appendChild(actions);

    row.onclick = function(e) {
      if (actions.contains(e.target)) return;
      importFromDriveFile(f);
    };
    return row;
  }
  /**
   * Build the per-row Hide menu:  Hide: [file] [folder]
   * Each tag is a 3-state cycle (off -> this one (badge "1") -> all by name
   * (badge "infinity") -> off). There is no [Done]: closing the menu (click-away
   * or kebab toggle) commits whatever the tags were cycled to, via menu._commit.
   */
  function buildHideMenu(f) {
    const menu = document.createElement('div');
    menu.className = 'pr-menu';

    const prefix = document.createElement('span');
    prefix.className = 'pr-menu-prefix';
    prefix.textContent = 'Hide:';
    prefix.title = 'Apply and close';
    menu.appendChild(prefix);

    const fileTag = makeHideTag('file');
    menu.appendChild(fileTag);

    let folderTag = null;
    if (f.folderId && f.folderName) {
      folderTag = makeHideTag('folder');
      menu.appendChild(folderTag);
    }

    menu._commit = function() {
      commitHide(f, fileTag.dataset.state, folderTag ? folderTag.dataset.state : 'off');
    };

    // Stop propagation so the click-away listener doesn't close (and commit)
    // while the user is still cycling tags inside the menu.
    menu.addEventListener('click', function(e) { e.stopPropagation(); });
    return menu;
  }
  // A hide tag is a file/folder glyph that cycles off -> "one" (badge 1, hide
  // this specific item by id) -> "all" (badge infinity, hide everything with
  // this name) -> off.
  function makeHideTag(kind) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pr-tag';
    btn.dataset.kind = kind;
    btn.dataset.state = 'off';
    const icon = kind === 'folder'
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm1 7V3.5L19.5 9H15z"/></svg>';
    btn.innerHTML = icon + '<span class="pr-tag-badge"></span>';
    const badge = btn.querySelector('.pr-tag-badge');
    function paint() {
      const s = btn.dataset.state;
      btn.classList.toggle('on', s !== 'off');
      badge.textContent = s === 'all' ? '∞' : (s === 'one' ? '1' : '');
      btn.title = s === 'all'
        ? 'Hiding every ' + kind + ' with this name'
        : (s === 'one' ? 'Hiding this ' + kind : 'Click to hide this ' + kind);
    }
    btn.onclick = function(e) {
      e.stopPropagation();
      btn.dataset.state = btn.dataset.state === 'off'
        ? 'one'
        : (btn.dataset.state === 'one' ? 'all' : 'off');
      paint();
    };
    paint();
    return btn;
  }
  function commitHide(f, fileState, folderState) {
    const ops = [];
    if (fileState === 'one') ops.push({ cmd: 'ignoreDriveFileId', payload: { id: f.id, name: f.name } });
    else if (fileState === 'all') ops.push({ cmd: 'ignoreDriveFileName', payload: { name: f.name } });
    if (folderState === 'one') ops.push({ cmd: 'ignoreDriveFolderId', payload: { id: f.folderId, name: f.folderName } });
    else if (folderState === 'all') ops.push({ cmd: 'ignoreDriveFolderName', payload: { name: f.folderName } });
    if (ops.length === 0) return;

    // Optimistic: add the rule(s) to the local settings copy so the row filters
    // out immediately. driveFiles keeps every file (including the one just
    // hidden) so a later Unhide is a local re-render, not a Drive rescan.
    ops.forEach(function(op) {
      if (op.cmd === 'ignoreDriveFileName') {
        currentSettings.ignoredDriveFileNames = (currentSettings.ignoredDriveFileNames || []).concat([op.payload.name]);
      } else if (op.cmd === 'ignoreDriveFileId') {
        currentSettings.ignoredDriveFileIds = (currentSettings.ignoredDriveFileIds || []).concat([{ id: op.payload.id, name: op.payload.name }]);
      } else if (op.cmd === 'ignoreDriveFolderName') {
        currentSettings.ignoredDriveFolderNames = (currentSettings.ignoredDriveFolderNames || []).concat([op.payload.name]);
      } else if (op.cmd === 'ignoreDriveFolderId') {
        currentSettings.ignoredDriveFolderIds = (currentSettings.ignoredDriveFolderIds || []).concat([{ id: op.payload.id, name: op.payload.name }]);
      }
    });
    computeDuplicateNames();
    renderPicker();

    // Run the server commands sequentially so the final settings reflect all ops.
    function runNext(i) {
      if (i >= ops.length) return;
      const op = ops[i];
      google.script.run
        .withSuccessHandler(function(settings) {
          currentSettings = settings;
          if (i === ops.length - 1) { computeDuplicateNames(); renderPicker(); }
          runNext(i + 1);
        })
        .withFailureHandler(function() { runNext(i + 1); })
        .gsheet2json_handleCommand(op.cmd, op.payload);
    }
    runNext(0);
  }
  function unignore(kind, value) {
    // Remove the rule from the local settings copy and re-render. The full file
    // list is already in driveFiles, so the unhidden file reappears in the main
    // list with no Drive rescan.
    if (kind === 'fileName') {
      currentSettings.ignoredDriveFileNames = (currentSettings.ignoredDriveFileNames || [])
        .filter(function(n) { return n !== value; });
    } else if (kind === 'fileId') {
      currentSettings.ignoredDriveFileIds = (currentSettings.ignoredDriveFileIds || [])
        .filter(function(r) { return r.id !== value; });
    } else if (kind === 'folderName') {
      currentSettings.ignoredDriveFolderNames = (currentSettings.ignoredDriveFolderNames || [])
        .filter(function(n) { return n !== value; });
    } else if (kind === 'folderId') {
      currentSettings.ignoredDriveFolderIds = (currentSettings.ignoredDriveFolderIds || [])
        .filter(function(r) { return r.id !== value; });
    }
    computeDuplicateNames();
    renderPicker();
    // Persist in the background; the unhide already repainted locally, so no
    // status bar (it was a fake timer-driven one anyway).
    google.script.run
      .withSuccessHandler(function(settings) {
        currentSettings = settings;
        computeDuplicateNames();
        renderPicker();
      })
      .withFailureHandler(function() {})
      .gsheet2json_handleCommand('unignoreDriveEntry', { kind: kind, value: value });
  }
  function closeRowMenus() {
    // Closing IS the commit: apply each open menu's cycled tag states. Snapshot
    // the commit fns first because commitHide -> renderPicker rebuilds the rows.
    const menus = Array.prototype.slice.call(pickerList.querySelectorAll('.pr-menu.open'));
    const commits = [];
    for (let i = 0; i < menus.length; i++) {
      menus[i].classList.remove('open');
      if (menus[i]._commit) commits.push(menus[i]._commit);
    }
    for (let j = 0; j < commits.length; j++) commits[j]();
  }
  // Modal hide menu: while a row's Hide menu is open, it captures the very next
  // click. Clicks on its cycling tags pass through (so they keep cycling);
  // everything else — the "Hide:" label, the kebab, the row/picker behind, the
  // background — commits the menu, closes it, and is swallowed (no propagation),
  // so an outside click can't accidentally trigger the element behind it.
  document.addEventListener('click', function(e) {
    const open = pickerList.querySelector('.pr-menu.open');
    if (!open) return;
    if (e.target.closest('.pr-tag')) return; // let the tag handle its own cycle
    e.preventDefault();
    e.stopPropagation();
    closeRowMenus();
  }, true);
  document.addEventListener('click', function(e) {
    if (!drivePicker.classList.contains('visible')) return;
    if (!e.target.closest('.pr-actions')) closeRowMenus();
    const btn = e.target.closest('button');
    // Skip tileImportDrive: its own onclick already toggles open/close, and
    // letting this handler also fire would close the picker on the same click
    // that just opened it.
    if (btn && !drivePicker.contains(btn) && btn !== tileImportDrive) closeDrivePicker();
  });
  pickerFilter.addEventListener('input', renderPicker);

  function renderHiddenList() {
    const foot = drivePicker.querySelector('.picker-foot');
    const names = currentSettings.ignoredDriveFileNames || [];
    const files = currentSettings.ignoredDriveFileIds   || [];
    const folderNames = currentSettings.ignoredDriveFolderNames || [];
    const folders = currentSettings.ignoredDriveFolderIds || [];
    const total = names.length + files.length + folderNames.length + folders.length;
    if (total === 0) {
      hiddenToggle.hidden = true;
      hiddenList.classList.remove('visible');
      if (foot) { foot.classList.remove('expanded'); foot.classList.remove('has-hidden'); }
      hiddenList.innerHTML = '';
      hiddenList.style.height = '';
      const f0 = drivePicker.querySelector('.picker-filter');
      const l0 = document.getElementById('pickerList');
      if (f0) f0.style.display = '';
      if (l0) l0.style.display = '';
      return;
    }
    hiddenToggle.hidden = false;
    const open = hiddenList.classList.contains('visible');
    if (foot) { foot.classList.add('has-hidden'); foot.classList.toggle('expanded', open); }
    hiddenToggle.classList.toggle('expanded', open);
    // Arrow on the LEFT of the label. Right-pointing chevron is rotated 90°
    // via CSS when .expanded so it points down — standard disclosure.
    hiddenToggle.innerHTML =
      `<svg class="hidden-toggle-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l8 6-8 6z"/></svg>${open ? 'Hide' : 'Show'} hidden (${total})`;
    hiddenList.innerHTML = '';
    names.forEach(function(n) {
      hiddenList.appendChild(renderHiddenRow('file-name', 'Files named', n, null, 'fileName', n));
    });
    files.forEach(function(r) {
      const url = `https://drive.google.com/file/d/${r.id}/view`;
      hiddenList.appendChild(renderHiddenRow('file', 'File', r.name || r.id, url, 'fileId', r.id));
    });
    folderNames.forEach(function(n) {
      hiddenList.appendChild(renderHiddenRow('folder-name', 'Folders named', n, null, 'folderName', n));
    });
    folders.forEach(function(r) {
      const url = `https://drive.google.com/drive/folders/${r.id}`;
      hiddenList.appendChild(renderHiddenRow('folder', 'Folder', r.name || r.id, url, 'folderId', r.id));
    });
  }
  function renderHiddenRow(cls, kindLabel, displayText, url, unignoreKind, unignoreValue) {
    const row = document.createElement('div');
    row.className = 'hidden-row';
    const kind = document.createElement('span');
    kind.className = 'hr-kind';
    kind.textContent = kindLabel;
    row.appendChild(kind);

    const textWrap = document.createElement('span');
    textWrap.className = 'hr-text';
    if (url) {
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = displayText;
      textWrap.appendChild(a);
    } else {
      textWrap.textContent = displayText;
    }
    row.appendChild(textWrap);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'hr-unhide';
    btn.textContent = 'Unhide';
    // stopPropagation so the document click-away handler doesn't fire: unignore
    // re-renders and detaches this button, after which the handler would see a
    // detached node, decide it's "outside" the picker, and close the picker.
    btn.onclick = function(e) { e.stopPropagation(); unignore(unignoreKind, unignoreValue); };
    row.appendChild(btn);
    return row;
  }
  hiddenToggle.onclick = function() {
    if (hiddenList.classList.contains('visible')) {
      // collapseHiddenList restores picker-filter/picker-list in case an
      // earlier extreme-grow had set them to display:none.
      collapseHiddenList();
    } else {
      hiddenList.classList.add('visible');
      renderHiddenList();
    }
  };

  /**
   * Clicking a Drive row no longer imports directly — it fetches the file
   * content and loads it into the staging textarea for review. The user
   * reviews/edits and clicks Import to commit.
   */
  function importFromDriveFile(f) {
    closeDrivePicker();
    startStatus(`Loading "${f.name}" from Drive\u2026`, 'slow');
    setTilesBusy(true);
    google.script.run
      .withSuccessHandler(function(info) {
        setTilesBusy(false);
        finishStatus();
        stagingSource = f.name + (f.folderName ? ` (${f.folderName})` : '');
        stagingTextarea.value = info && info.content ? info.content : '';
        validateStaging();
        growStagingToFitContent();
        stagingTextarea.focus();
      })
      .withFailureHandler(function(err) {
        setTilesBusy(false);
        abortStatus();
        const msg = (err && err.message) ? err.message : 'Load failed';
        activityEntry({ ok: false, title: `Could not load "${f.name}" from Drive`, error: msg });
      })
      .gsheet2json_handleCommand('getDriveFileInfo', f.id);
  }

  function checkOnboarding() {
    google.script.run
      .withSuccessHandler(function(isFirst) {

  // Baked into THIS bundle at build time so the gear reports the version of the

  const SIDEBAR_VERSION = "1.2.44";

  /* ════════════════════════════════════════════════════════════════════════

     ════════════════════════════════════════════════════════════════════════ */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // Compact byte formatting for the picker's per-row size label. Uses 1 decimal
  // below 10 of each unit (5.4 KB) and integer above (234 KB) to keep the second
  // line visually short on a narrow sidebar.
  function formatBytes(n) {
    if (!n || n < 1) return '';
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) {
      const kb = n / 1024;
      return `${kb < 10 ? kb.toFixed(1) : Math.round(kb)} KB`;
    }
    const mb = n / (1024 * 1024);
    return `${mb < 10 ? mb.toFixed(1) : Math.round(mb)} MB`;
  }

  /* ════════════════════════════════════════════════════════════════════════
