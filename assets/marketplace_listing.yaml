# Google Workspace Marketplace submission copy for gsheet2json.
# Paste values from this file into the Marketplace SDK Store Listing tab.
# Source of truth for app name, descriptions, pricing, and URLs.

app_name: gsheet2json

# Mirrors VERSION in src/main.ts and version in package.json. Static check
# features/pre_submit_hygiene.feature asserts all three stay in sync.
appVersion: "1.1.1"

# 200-char hard limit per the Marketplace SDK Store Listing UI (was previously
# documented as 80; updated 2026-05-04 from observed UI counter).
short_description: "Export/Import Sheet Tabs to JSON files with formatting, formulas, validations, named ranges. Built for AI workflows."

detailed_description: |
  gsheet2json exports the active Google Sheets tab to a JSON file with full fidelity: values, formatting, formulas, validations, dimensions, and named ranges all round-trip cleanly back into a new tab on import.

  Built for AI workflows: Feed Sheet data into Claude, ChatGPT, Gemini, MCP servers, or any platform that handles JSON better than CSV or screenshots.

  How it works: Open the sidebar via Extensions > gsheet2json > Open. Export saves a timestamped JSON file to Drive (or downloads locally). Import reads JSON from Drive, a local file, or paste, and rebuilds the tab exactly.

  Key features:
  • One-click export to Drive or local download
  • Full-fidelity import: values, formulas, formatting, validations, dimensions, named ranges
  • Compact output via style and value deduplication
  • Data validation preserved: dropdowns, checkboxes, custom formulas
  • Drive picker for recent JSON files
  • Per-export toggles
  • Runs inside Google Sheets with no external servers

  Privacy: Reads and writes a new tab on import. Files save to your Drive. Preferences stay in your Google account. No data leaves your account.

category:
  # Marketplace SDK Store Listing only exposes a single category slot (no
  # secondary as of 2026-05-04), and the available primaries no longer
  # include "Productivity" -- updated to "Office Applications" which is
  # where Sheets-add-on browsers naturally land.
  primary: Office Applications

regions: All

urls:
  # All URLs use short-vanity domains that 301 to canonical targets.
  # Split by purpose: bug-reporting -> g2j.support, getting-started -> g2j.in.
  setup: https://g2j.in                       # No separate setup flow; install IS the setup
  support: https://g2j.support
  help: https://g2j.support                   # Same surface as support
  report_issue: https://g2j.support           # Canonical purpose of g2j.support -- 301s to GitHub issues
  post_install_tip: https://g2j.in            # First-impression UX, not issues tracker
  admin_config: https://g2j.in                # Placeholder for v1; admin-specific surface TBD post-launch
  application_home: https://g2j.in            # 301s to gsheet2json.com pre-approval, Marketplace listing post-approval
  developer_website: https://g2j.dev          # redirects to github.com/appliedmedia/gsheet2json
  # Direct canonical URLs required here: Google's verifier does not follow
  # redirects, and g2j.pub/legal is a 5-hop chain through tinycc. The bare
  # gsheet2json.com/legal path 404s; the live pages are the slugs below
  # (each verified 0-hop, 200, text/html). Vanity shorteners are preserved
  # for docs/screenshots/external refs; these two Marketplace fields are the
  # only exception (see OAuthVerificationFixes.md Issue 2).
  privacy_policy: https://gsheet2json.com/privacy-policy
  terms_of_service: https://gsheet2json.com/legal-eula-tos

draft_testers:
  # Distinct from OAuth consent screen Test Users (which gates verification).
  # This field gates who can install the unpublished Marketplace draft.
  - a@cov.in

pricing:
  # v1 launch: Free of charge (2026-05-10 decision). Sidesteps the merchant
  # account prereq for a faster path to market. Paid tiers below are
  # preserved for the v2 flip once merchant account is set up; see Step 4 of
  # docs/plans/2026-05-09_plan_todo_AndrewHandsOnRequired.md.
  v1_launch: Free of charge
  v2_paid_deferred:
    trial:
      duration_days: 7
      cost: Free
    monthly:
      amount_usd: 3
      unit: per user per month
    annual:
      amount_usd: 25
      unit: per user per year
    lifetime:
      amount_usd: 50
      unit: one-time per user
