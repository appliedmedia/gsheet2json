<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="220" height="140" viewBox="0 0 220 140">
  <!-- Application Card Banner: 220x140, dark green background -->

  <!-- Canvas: dark green -->
  <rect x="0" y="0" width="220" height="140" fill="#0a3d22"/>

  <!-- Left column: logo glyph 96x96 centered in 120x140 (top-left at 12,22) -->
